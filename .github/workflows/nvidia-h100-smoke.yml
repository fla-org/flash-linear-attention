name: nvidia-h100-smoke

# Fast feedback tier: on every PR push and every main push, run the PR's
# dependent test files, but only the smoke-marked core tests under tests/ops.
# Small non-ops suites (modules/layers/utils/context_parallel) run in full;
# tests/models is not part of this tier. The full pipeline lives in
# nvidia-h100.yml and runs on maintainer PRs, on PR approval, and nightly.

concurrency:
  group: smoke-ci-${{ github.event.pull_request.number || github.ref }}
  # A new push cancels only the previous smoke run; it must never cancel the
  # approval-triggered full pipeline, which uses a different concurrency group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  pull_request:
    branches: [ '*' ]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect smoke-skippable changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Detect NPU-only diff
        id: detect
        uses: actions/github-script@v9.0.0
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('skip', 'false');
              return;
            }
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            // NPU-only PRs: nothing for the GPU smoke to cover.
            const npuSafe = /^fla\/(.+\/)?backends\/triton_ascend\/(?!.*__init__\.py$)|^\.github\/workflows\/ascend-|^\.agents\/skills\/fla-ascend-performance\//;
            const names = files.map(f => f.filename);
            core.setOutput('skip', names.length > 0 && names.every(n => npuSafe.test(n)) ? 'true' : 'false');

  smoke:
    name: Smoke (PyTorch 2.12)
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: nvidia-h100-1
    timeout-minutes: 60
    env:
      FLA_CI_ENV: 1
    steps:
      - name: Check out repo
        uses: actions/checkout@v7.0.0

      - name: Setup CI Environment
        id: setup
        uses: ./.github/actions/setup-ci-env
        with:
          runner_name: ${{ runner.name }}
          conda_env_name: 'pytorch_2_12'
          gpu_type: 'nvidia'
          install_tilelang: "true"
          skip_gpu_check: true

      - name: Find dependent test files (excluding models)
        if: steps.setup.outputs.skip_tests == 'false'
        id: find-tests
        shell: bash
        run: |
          export TEST_SCOPE="EXCLUDE_MODELS"
          TEST_FILES=$($CONDA_BIN_PATH/python scripts/find_dependent_tests.py "${{ steps.setup.outputs.all_changed_files }}")
          echo "Found dependent test files: $TEST_FILES"
          echo "test_files=$TEST_FILES" >> $GITHUB_OUTPUT

      - name: Run smoke-marked tests in dependent ops files
        if: steps.find-tests.outputs.test_files && steps.setup.outputs.skip_tests == 'false'
        shell: bash
        run: |
          # Per-file processes, same as the full suite (avoids runner OOM).
          for f in ${{ steps.find-tests.outputs.test_files }}; do
            case "$f" in
              tests/ops/*)
                $CONDA_BIN_PATH/pytest -s -v --exitfirst -m smoke "$f" || exit 1 ;;
            esac
          done

      - name: Run small non-ops suites in full
        if: steps.find-tests.outputs.test_files && steps.setup.outputs.skip_tests == 'false'
        shell: bash
        run: |
          for f in ${{ steps.find-tests.outputs.test_files }}; do
            case "$f" in
              tests/ops/*) ;;
              *) $CONDA_BIN_PATH/pytest -s -v --exitfirst "$f" || exit 1 ;;
            esac
          done
