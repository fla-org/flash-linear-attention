name: Agent-selected Ascend A2 tests

run-name: agent-a2-${{ inputs.pr_number }}-${{ inputs.attempt_id }}-${{ inputs.suite }}

concurrency:
  group: agent-a2-${{ inputs.pr_number }}-${{ inputs.attempt_id }}-${{ inputs.suite }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs: &agent_test_inputs
      pr_number:
        description: Pull request number
        required: true
        type: string
      attempt_id:
        description: Immutable review attempt ID
        required: true
        type: string
      base_sha:
        description: Exact base commit
        required: true
        type: string
      head_sha:
        description: Exact PR head commit
        required: true
        type: string
      suite:
        description: Test suite from .github/agent-tests/catalog.json
        required: true
        type: string
      targets:
        description: Space-separated test files or nodeids inside the selected suite
        required: true
        type: string
      dispatch:
        description: Backend dispatch mode
        required: true
        type: string
        default: both
      source_ref:
        description: Trusted source ref for the runner and catalog
        required: false
        type: string
        default: main
  workflow_call:
    inputs: *agent_test_inputs

permissions:
  contents: read

jobs:
  test:
    name: Agent A2 / ${{ inputs.suite }} / ${{ inputs.dispatch }}
    runs-on: linux-aarch64-a2-8
    timeout-minutes: 180
    container:
      image: ascendai/cann:9.1.0-910b-ubuntu22.04-py3.12
      options: >-
        --shm-size 16g
      env:
        HF_ENDPOINT: https://hf-mirror.com
    env:
      FLA_CI_ENV: 1
      FLA_NPU_XDIST: ${{ inputs.suite == 'cp' && '0' || '1' }}
      ASCEND_RT_VISIBLE_DEVICES: '0,1,2,3,4,5,6,7'
      TRITON_CACHE_DIR: ${{ github.workspace }}/.triton-agent-${{ inputs.attempt_id }}
      FLA_AGENT_PR_NUMBER: ${{ inputs.pr_number }}
      FLA_AGENT_ATTEMPT_ID: ${{ inputs.attempt_id }}
      FLA_AGENT_BASE_SHA: ${{ inputs.base_sha }}
      FLA_AGENT_HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check out trusted workflow sources
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stage trusted test runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-ci" "$RUNNER_TEMP/agent-ci-results"
          cp scripts/agent_ci.py "$RUNNER_TEMP/agent-ci/agent_ci.py"
          cp .github/agent-tests/catalog.json "$RUNNER_TEMP/agent-ci/catalog.json"

      - name: Fetch and verify exact PR commits
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          [[ "$FLA_AGENT_PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$FLA_AGENT_ATTEMPT_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin "refs/pull/${FLA_AGENT_PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD_SHA"
          if ! git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$EXPECTED_BASE_SHA"
          fi
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA...$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/agent-ci-results/changed_files.txt"
          git checkout --detach "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install PR revision and NPU dependencies
        shell: bash
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install pybind11 cmake attrs sympy pyyaml scipy decorator einops
          python -m pip install ".[npu,test]" \
            --extra-index-url=https://triton-ascend.osinfra.cn/pypi/simple

      - name: Verify NPU environment
        shell: bash
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python - <<'PY'
          import torch
          import torch_npu
          import triton
          from fla.utils import IS_NPU, device_platform

          print('torch:', torch.__version__)
          print('torch_npu:', torch_npu.__version__)
          print('triton:', triton.__version__)
          print('device_platform:', device_platform)
          assert IS_NPU, 'Expected NPU backend'
          PY

      - name: Run selected tests
        shell: bash
        env:
          AGENT_TEST_TARGETS: ${{ inputs.targets }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          python "$RUNNER_TEMP/agent-ci/agent_ci.py" \
            --catalog "$RUNNER_TEMP/agent-ci/catalog.json" \
            --platform ascend-a2 \
            --suite '${{ inputs.suite }}' \
            --targets "$AGENT_TEST_TARGETS" \
            --dispatch '${{ inputs.dispatch }}' \
            --results "$RUNNER_TEMP/agent-ci-results/junit" \
            --metadata "$RUNNER_TEMP/agent-ci-results/metadata.json"

      - name: Upload attempt evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-a2-${{ inputs.attempt_id }}-${{ inputs.suite }}
          path: ${{ runner.temp }}/agent-ci-results/
          if-no-files-found: error
          retention-days: 7
