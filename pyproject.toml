[project]
name = "flash-linear-attention"
dynamic = ["version"]
description = "Fast Triton-based implementations of causal linear attention"
readme = "README.md"
authors = [
    { name = "Songlin Yang", email = "yangsl66@mit.edu" },
    { name = "Yu Zhang", email = "yzhang.cs@outlook.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# torch and triton are NOT in base deps. Pick a backend extra
# ([cuda] / [rocm] / [xpu] / [cpu]) plus the matching --extra-index-url.
dependencies = [
    "transformers>=5.6.2,<6",
    "einops",
]

[project.optional-dependencies]
cuda = ["torch>=2.7.0", "triton>=3.3"]
# rocm / xpu intentionally don't pin a triton flavor: torch sourced from the
# matching PyTorch wheel index pulls the right one transitively (pytorch-triton-rocm
# on stable, triton-rocm on nightly, etc.).
rocm = ["torch>=2.7.0"]
xpu  = ["torch>=2.7.0"]
npu  = ["torch==2.9.0", "torch_npu==2.9.0.post6", "torchvision==0.24.0", "triton-ascend==3.2.2"]
# Install exactly one AscendC extra: all three wheels provide the fla_npu namespace.
# From this checkout: python -m pip install -e ".[npu-ascendc-a2]"  # A2 / 910B
#                     python -m pip install -e ".[npu-ascendc-a3]"  # A3 / 910_93
#                     python -m pip install -e ".[npu-ascendc-a5]"  # A5 / 950
# These extras add only the native wheel; prepare CANN and the NPU Python stack first.
# pip selects the CPU architecture; the KDA adapter currently supports A5 only.
npu-ascendc-a2 = [
    "flash-linear-attention-npu-a2 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a2-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_aarch64.whl#sha256=4df60e6ae1567958ed688bd44c6f53fd176258bd3702c0a08df16df1b4ccd8de ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flash-linear-attention-npu-a2 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a2-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_x86_64.whl#sha256=280421d759b54574730ed409b5ce7efb83b8d4bbc62723cefa33f8294df84f04 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
npu-ascendc-a3 = [
    "flash-linear-attention-npu-a3 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a3-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_aarch64.whl#sha256=8081e8f4eb1f46d77843d6de427db6a7510aa233a5625ed7dc36f8012e620525 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flash-linear-attention-npu-a3 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a3-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_x86_64.whl#sha256=6e4db7a0539a194402dbabf7b5d08444f801ccaefb3ee56928e3a923c7e92cad ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
npu-ascendc-a5 = [
    "flash-linear-attention-npu-a5 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a5-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_aarch64.whl#sha256=5a61d0bdd54a0abbdfaad9681231c6e0b08063e54d3e0171082b75de7c7eae0e ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flash-linear-attention-npu-a5 @ https://github.com/flashserve/flash-linear-attention-npu/releases/download/main-20261019-030140/flash_linear_attention_npu_a5-26.10.0%2Bmain.dev54ae09b-py3-none-manylinux_2_34_x86_64.whl#sha256=53eebf55c4beac66669e206601b9317eda9bd86f44f7b9da5e20ebcaee266449 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
cpu  = ["torch>=2.7.0", "triton>=3.3"]
tilelang = ["tilelang>=0.1.9"]
conv1d = ["causal-conv1d>=1.7.0"]
benchmark = ["matplotlib", "pandas", "datasets>=3.3.0"]
test = ["pytest", "pytest-xdist"]

[project.urls]
Homepage = "https://github.com/fla-org/flash-linear-attention"
Repository = "https://github.com/fla-org/flash-linear-attention"

[build-system]
requires = ["setuptools>=64", "wheel"]

[tool.setuptools.dynamic]
version = {attr = "fla.__version__"}

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
markers = [
    "smoke: core tests run in the dependent-files smoke tier on every PR push (fast feedback)",
]
pythonpath = [
  "."
]

[tool.ruff]
target-version = "py310"
line-length = 127


[tool.autopep8]
max-line-length = 127


[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "C4",   # flake8-comprehensions
    "TCH",  # flake8-type-checking
    "T",    # flake8-debugger
]
ignore = [
    # pycodestyle (E)
    "E501",   # line-too-long: Triton kernels and benchmark tables often have long calls/shape lists.
    "E741",   # ambiguous-variable-name: math code commonly uses short symbols like l/I/O.

    # flake8-bugbear (B)
    "B023",   # function-uses-loop-variable: closures in generated/autotuned code may intentionally capture loop vars.
    "B006",   # mutable-argument-default: some APIs use defaults like []/{} for compatibility with existing call sites.
    "B007",   # unused-loop-control-variable: loops may keep named indices for shape/layout readability.
    "B008",   # function-call-in-default-argument: defaults sometimes depend on module-level factories/constants.
    "B028",   # no-explicit-stacklevel: warning locations are usually less important in tests/scripts.
    "B904",   # raise-without-from-inside-except: concise re-raise patterns are used in compatibility paths.
    "B905",   # zip-without-explicit-strict: many zips intentionally allow the pre-Python-3.10 default strict=False behavior.

    # flake8-comprehensions (C4)
    "C408",   # unnecessary-collection-call: dict()/list()/tuple() can be clearer when constructing dynamic values.
    "C416",   # unnecessary-comprehension: comprehensions may preserve structure for later filtering/debugging.
    "C417",   # unnecessary-map: map(...) is allowed when it mirrors functional or data-pipeline code.

    # flake8-debugger / print checks (T)
    "T201",   # print-found: benchmark, release, and CI helper scripts intentionally print progress and summaries.

    # flake8-type-checking (TC)
    "TC002",  # typing-only-third-party-import: moving imports behind TYPE_CHECKING can hide optional dependency failures.
    "TC003",  # typing-only-standard-library-import: runtime stdlib imports are cheap and often improve readability.

    # flake8-simplify (SIM)
    "SIM102", # collapsible-if: nested guards often document staged shape/device checks.
    "SIM108", # if-else-block-instead-of-if-exp: explicit branches are easier to debug around tensor setup.
    "SIM118", # in-dict-keys: explicit .keys() can be clearer when the object is mapping-like, not always a plain dict.
    "SIM211", # if-expr-with-false-true: keep explicit boolean expressions when they mirror config/env logic.

    # flake8-commas (COM)
    "COM812", # missing-trailing-comma: formatter/autofix tools should own trailing comma style.
]
extend-select = ["RUF022"]

[tool.ruff.lint.isort]
known-first-party = ["fla"]
force-sort-within-sections = false

[tool.isort]
profile = "black"
line_length = 127
known_first_party = ["fla"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"fla/utils.py" = ["TCH004"]
"evals/harness.py" = ["I", "TCH"]
"tests/conftest.py" = ["E402", "I001"]
"tests/*/*.py" = ["UP030"]
"scripts/*.py" = ["C414"]
"legacy/training/flame/*.py" = ["C408"]
